name: Build Focus iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Run Mozilla Bootstrap for Focus
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh focus

      - name: Build Focus Scheme
        run: |
          xcodebuild archive \
            -project focus-ios/Blockzilla.xcodeproj \
            -scheme Focus \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Focus.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload as IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Focus.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Focus.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Unsigned-IPA
          path: build/Focus.ipa
